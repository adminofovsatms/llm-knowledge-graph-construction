<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jonathan's Injury Timeline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.25.0/cytoscape.min.js"></script>
</head>
<body>
  <section class="cd-horizontal-timeline">
    <div class="timeline">
      <ul class="cd-timeline-navigation">
        <li><a href="#0" class="prev inactive"><i class="fas fa-chevron-left"></i></a></li>
        <li><a href="#0" class="next"><i class="fas fa-chevron-right"></i></a></li>
      </ul>
      <div class="events-wrapper">
        <div class="events">
          <ol id="timeline">
            <!-- Dynamically populated by JS -->
          </ol>
          <span class="filling-line" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </section>

  <div id="cy"></div>
  <div id="injury-details">
    Click a body part to see injury details here.
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
