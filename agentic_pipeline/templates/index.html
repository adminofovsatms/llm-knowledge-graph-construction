<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jonathan's Injury Timeline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.25.0/cytoscape.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</head>
<body>
  <!-- Scrollable Timeline -->
  <section class="timeline-container">
    <div class="swiper-container">
      <div class="swiper-wrapper timeline" id="timeline">
        <!-- Dynamically populated by JS -->
      </div>
    </div>
  </section>

  <!-- Stick Figure Graph -->
  <div id="cy"></div>

  <!-- Injury Details Panel -->
  <div id="injury-details">
    Click a body part to see injury details here.
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
