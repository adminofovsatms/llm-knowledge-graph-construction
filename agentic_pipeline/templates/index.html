<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jonathan's Injury Timeline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.25.0/cytoscape.min.js"></script>
</head>
<body>
  <!-- New Timeline -->
  <section class="cd-h-timeline js-cd-h-timeline margin-bottom-md" id="timeline">
    <div class="cd-h-timeline__nav-wrapper">
      <a href="#0" class="cd-h-timeline__nav cd-h-timeline__nav--prev" id="prev-btn" style="display: none;">&#10094;</a>
      <div class="cd-h-timeline__line-wrapper">
        <div class="cd-h-timeline__line">
          <ol id="date-list">
            <!-- JS will populate -->
          </ol>
          <span class="cd-h-timeline__filling-line" aria-hidden="true"></span>
        </div>
      </div>
      <a href="#0" class="cd-h-timeline__nav cd-h-timeline__nav--next" id="next-btn" style="display: none;">&#10095;</a>
    </div>
  </section>  

  <!-- Stick Figure Graph -->
  <div id="cy"></div>

  <!-- Injury Details Panel -->
  <div id="injury-details">
    Click a body part to see injury details here.
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
